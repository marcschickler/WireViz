metadata:
  title: Direct connections without cables

connectors:
  X1:
    type: Source
    pincount: 4
  X2:
    type: Distribution point
    pincount: 4
  X3:
    type: Load
    pincount: 4

connections:
  # Compact syntax: adjacent connectors are connected directly, pin by pin.
  # This creates no cable definition, cable node or cable BOM item.
  - - X1: [1-4]
    - X2: [1-4]

  # Optional styling: use a direct marker between the connectors.
  # WireViz short color codes such as RD, GN, BU etc. can be used.
  - - X2: [1]
    - direct:
        color: RD
        label: "24 V"
    - X3: [1]

  - - X2: [2]
    - direct:
        color: BU
        label: "GND"
    - X3: [2]

  # Label and color are independently optional.
  - - X2: [3]
    - direct:
        label: "Signal"
    - X3: [3]

  - - X2: [4]
    - direct:
        color: GN
    - X3: [4]
